<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Panel – Jamie</title>
  <style>
    :root {
      --primary-color: #6a5acd;
      --secondary-color: #ff7eb9;
      --accent-color: #7afcff;
      --light-color: #f9f7ff;
      --dark-color: #2a265f;
      --success-color: #42b983;
    }

    body {
      font-family: 'Nunito', sans-serif;
      background: linear-gradient(135deg, var(--primary-color), #8a7cff);
      min-height: 100vh;
      margin: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 1100px;
      padding: 40px 30px;
      background-color: var(--light-color);
      border-radius: 25px;
      box-shadow: 0 20px 50px rgba(106, 90, 205, 0.2);
    }

    h2 {
      text-align: center;
      color: var(--dark-color);
      margin-bottom: 35px;
      font-size: 2rem;
      font-weight: 700;
    }

    form {
      display: flex;
      flex-direction: column;
      max-width: 400px;
      margin: 0 auto;
      padding: 25px;
      border-radius: 20px;
      background-color: var(--light-color);
      box-shadow: 0 10px 30px rgba(106, 90, 205, 0.1);
    }

    input {
      padding: 12px 15px;
      margin-bottom: 15px;
      border: 1px solid #ced4da;
      border-radius: 12px;
      font-size: 1rem;
      transition: all 0.3s ease;
    }

    input:focus {
      outline: none;
      border-color: var(--primary-color);
      box-shadow: 0 0 8px rgba(106,90,205,0.3);
    }

    button {
      padding: 12px;
      background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
      color: #fff;
      font-size: 1rem;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      font-weight: 600;
      transition: all 0.3s ease;
    }

    button:hover {
      background: linear-gradient(135deg, #5949c9, #ff7eb9);
      box-shadow: 0 6px 20px rgba(0,0,0,0.15);
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 25px;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 10px 30px rgba(106,90,205,0.1);
      background-color: var(--light-color);
    }

    th, td {
      padding: 15px 20px;
      text-align: left;
    }

    th {
      background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
      color: #fff;
      font-weight: 600;
      text-transform: uppercase;
      font-size: 0.9rem;
    }

    tr:nth-child(even) {
      background-color: #f0f0f5;
    }

    tr:hover {
      background-color: #e3f2fd;
      transition: all 0.3s ease;
    }

    @media (max-width: 768px) {
      table, th, td {
        font-size: 0.85rem;
      }
      form {
        padding: 20px;
      }
    }
  </style>
</head>
<body>

<div class="container">
  <h2>Admin Panel – Jamie</h2>

  {% if users == None %}
    <!-- ADMIN LOGIN -->
    <form method="post">
      <input type="email" name="email" placeholder="Admin Email" required>
      <input type="password" name="password" placeholder="Password" required>
      <button type="submit">Login</button>
    </form>

  {% else %}
    <!-- USERS TABLE -->
    <table>
      <tr>
        <th>Parent Name</th>
        <th>Child Name</th>
        <th>Email</th>
        <th>Password</th>
      </tr>

      {% for user in users %}
      <tr>
        <td>{{ user['name'] }}</td>
        <td>{{ user['childName'] if user.get('childName') else '' }}</td>
        <td>{{ user['email'] }}</td>
        <td>{{ user['password'] }}</td>
      </tr>
      {% endfor %}

    </table>
  {% endif %}
</div>

</body>
</html>
